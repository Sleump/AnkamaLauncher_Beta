<template>
  <div class="m-release-pushes-wrapper" v-if="pushes.length">
    <div class="m-release-pushes--header">
      <span class="m-release-pushes--header-title">{{ $t('releaseViewPushes.title') }}</span>
      <a class="m-release-pushes--header-more" @click="openExternalPush({url: moreUrl})" v-if="moreUrl">
        {{ $t('releaseViewPushes.moreLink') }}
      </a>
    </div>
    <div class="m-release-pushes">
      <a class="m-release-pushes--push" v-for="push in pushes" @click="openExternalPush(push)">
        <div class="m-release-pushes--push-image" :style="{'background-image': 'url(' + push.imageUrl + ')'}"></div>
        <div class="m-release-pushes--push-title-wrapper">
          <div class="m-release-pushes--push-title">
            {{ push.title }}
          </div>
          <div class="m-release-pushes--push-date" v-if="push.date">
            {{ push.date }}
          </div>
        </div>
      </a>
    </div>
  </div>
</template>

<script>
  /* global ipcRenderer, remoteCommunication */
  VueComponent(this, 'release-view-pushes', {
    props: [
      'release',
    ],
    computed: {
      language() {
        return this.$store.state.settings[SETTINGS_KEYS.LANGUAGE]
      },
      pushes() {
        return this.$store.getters.displayedRelease.news
      },
      moreUrl() {
        // "+ d'actus" renvoie vers la liste complete des actus du site : on
        // la deduit du lien du premier item (racine = tout avant "news.php"
        // ou "/api/" pour rester generique sur l'hebergement) plutot que de
        // coder en dur une URL de site dans ce composant generique.
        if (!this.pushes.length || !this.pushes[0].url) {
          return null
        }

        return this.pushes[0].url.replace(/\/[^/]*\.php(\?.*)?$/, '/')
      },
    },
    methods: {
      refreshNews() {
        if (this.release) {
          this.$store.dispatch('refreshNews', this.release)
        }
      },
      openExternalPush(push) {
        this.$store.dispatch('openExternal', push.url)
        ipcRenderer.send(remoteCommunication.CHANNELS.RELEASE_NEWS_CLICK, push.id, push.type)
      },
    },
    watch: {
      release() {
        this.refreshNews()
      },
    },
    mounted() {
      this.refreshNews()
    },
  })
</script>
