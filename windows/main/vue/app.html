<link rel="import" href="./login/index.html">
<link rel="import" href="./logbox/index.html">
<link rel="import" href="./tab-games/index.html">
<link rel="import" href="./terms/index.html">
<link rel="import" href="./terms-overlay/index.html">
<link rel="import" href="./window-controls/index.html">
<link rel="import" href="./zaap-autoupdate/zaap-autoupdate-popup/index.html">
<link rel="import" href="./zaap-autoupdate/zaap-autoupdate-progress/index.html">
<link rel="import" href="./zaap-settings/index.html">

<template>
  <div id="app" class="m-app" :class="classes">
    <window-controls v-if="!windowIsFullscreen"></window-controls>

    <div class="m-app-container">
      <terms-overlay v-if="needsToAcceptNewTerms"></terms-overlay>

      <template v-else>
        <login v-if="!isAuthenticated || isUserLoading"></login>
        <template v-else>
          <aside class="m-app--rail">
            <img class="m-app--rail-logo" :src="component.path + '/logo-retro-official.png'" alt="">

            <ul class="m-app--rail-icons">
              <li class="m-app--rail-icon m-app--rail-icon__active" @click="showTab('games')"
                  :title="$t('header.menu.games')">
                <zaap-icon icon="controller"></zaap-icon>
              </li>
              <li class="m-app--rail-icon m-app--rail-icon__disabled" :title="$t('header.rail.videosSoon')">
                <zaap-icon icon="tv"></zaap-icon>
              </li>
              <li class="m-app--rail-icon m-app--rail-icon__disabled" :title="$t('header.rail.voiceSoon')">
                <zaap-icon icon="mic"></zaap-icon>
              </li>
              <li class="m-app--rail-icon m-app--rail-icon__disabled" :title="$t('header.rail.docsSoon')">
                <zaap-icon icon="document"></zaap-icon>
              </li>
              <li class="m-app--rail-icon m-app--rail-icon__disabled" :title="$t('header.rail.gallerySoon')">
                <zaap-icon icon="image"></zaap-icon>
              </li>
              <li class="m-app--rail-icon" @click="openShop" :title="$t('header.rail.shop')">
                <zaap-icon icon="shop"></zaap-icon>
              </li>
            </ul>

            <div class="m-app--rail-add" :title="$t('header.rail.addGameSoon')">
              <zaap-icon icon="plus"></zaap-icon>
            </div>
          </aside>

          <div class="m-app--content">
            <header class="m-app--header">
              <div class="m-app--header-banner">
                <div class="m-app--header-banner-logo-wrap">
                  <img :src="component.path + '/logo-dofusretro-official.png'" class="m-app--header-banner-logo" alt="Dofus Retro">
                  <zaap-autoupdate-progress></zaap-autoupdate-progress>
                </div>
                <zaap-icon icon="sparkle" class="m-app--header-banner-deco"></zaap-icon>
                <zaap-icon icon="medal" class="m-app--header-banner-deco"></zaap-icon>
              </div>

              <div class="m-app--header-actions">
                <div class="m-app--header-action" @click="openSupport" :title="$t('header.support')">
                  <zaap-icon icon="chat"></zaap-icon>
                </div>
                <div class="m-app--header-action" @click="openSettings" :title="$t('header.settings')">
                  <zaap-icon icon="gear"></zaap-icon>
                </div>

                <logbox></logbox>
              </div>
            </header>

            <tab-games v-if="currentTab === 'games'"></tab-games>
          </div>
        </template>
      </template>

      <zaap-settings></zaap-settings>
      <zaap-autoupdate-popup></zaap-autoupdate-popup>
    </div>
  </div>
</template>

<script>
  VueComponent(this, 'app', {
    data: {
      currentTab: 'games',
    },
    computed: {
      isUserLoading() {
        return this.$store.state.user.isLoading
      },
      isAuthenticated() {
        return this.$store.state.auth.isAuthenticated
      },
      acceptedTermsVersion() {
        return this.$store.state.settings[SETTINGS_KEYS.ACCEPTED_TERMS_VERSION]
      },
      needsToAcceptNewTerms() {
        return this.$store.state.terms.needsToAcceptNewVersion
      },
      windowIsMaximized() {
        return this.$store.state.window.isMaximized
      },
      windowIsFullscreen() {
        return this.$store.state.window.isFullscreen
      },
      classes() {
        return {
          'm-app__darwin': process.platform === 'darwin',
          'm-app__maximized': this.windowIsMaximized,
          'm-app__fullscreen': this.windowIsFullscreen,
        }
      },
    },
    methods: {
      showTab(tabName) {
        this.currentTab = tabName
      },
      openShop() {
        this.$store.dispatch('goAnkamaOpen', 'shop')
      },
      openSupport() {
        this.$store.dispatch('goAnkamaOpen', 'support')
      },
      openSettings() {
        this.$store.dispatch('openZaapSettingsPopup')
      },
    },
    watch: {
      acceptedTermsVersion() {
        this.$store.dispatch('termsNeedsToAcceptNewVersion')
      },
    },
  })
</script>

<style>
  .m-app::before,
  .m-app::after {
    content: "";
    display: block;
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 9999;
    pointer-events: none;
    border: 1px solid var(--color-white);
    opacity: 0.05;
    transition: opacity 150ms;
  }

  .m-app::after {
    border: 1px solid var(--color-white);
  }

  .m-app.m-app__darwin:not(.m-app__fullscreen)::before,
  .m-app.m-app__darwin:not(.m-app__fullscreen)::after {
    border-radius: 5px;
  }

  .m-app.m-app__maximized::before,
  .m-app.m-app__maximized::after,
  .m-app.m-app__fullscreen::before,
  .m-app.m-app__fullscreen::after {
    opacity: 0;
  }

  .m-app__not-allowed {
    background: linear-gradient(to bottom right, #251426, #151a2d);
  }

  .m-app-container {
    position: relative;
    display: flex;
    height: calc(100% - var(--m-window-controls-height));
    transform: translateZ(0);
  }

  .m-app.m-app__fullscreen .m-app-container {
    height: 100%;
  }

  .m-app--not-allowed {
    position: absolute;
    top: 50%;
    left: 50%;
    color: var(--color-white);
    padding: 100px;
    background: rgba(0, 0, 0, 0.3);
    text-align: center;
    transform: translate(-50%, -50%);
  }

  .m-app--not-allowed-title {
    font: var(--font-title);
  }

  /**
   * Left rail (app/feature switcher, style du vrai launcher Ankama) --
   * seule l'icone "Games" (manette) est fonctionnelle : les autres
   * correspondent a des produits/fonctionnalites Ankama qu'on n'a pas
   * (stream, vocal, documents, galerie). Gardees visibles pour la
   * ressemblance visuelle demandee, desactivees au clic (voir
   * m-app--rail-icon__disabled) pour ne pas laisser croire qu'elles font
   * quelque chose.
   */
  .m-app--rail {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: var(--aside-width);
    height: 100%;
    flex-shrink: 0;
    background: var(--color-black-pearl);
    z-index: 2;
    padding: 10px 0;
  }

  .m-app--rail-logo {
    width: 36px;
    height: 36px;
    margin-bottom: 12px;
  }

  .m-app--rail-icons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 100%;
  }

  .m-app--rail-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    color: var(--color-white-50);
    cursor: pointer;
    transition: background 150ms, color 150ms;
  }

  .m-app--rail-icon .c-zaap-icon {
    width: 20px;
    height: 20px;
  }

  .m-app--rail-icon:hover {
    background: var(--color-white-10);
    color: var(--color-white);
  }

  .m-app--rail-icon__active {
    background: var(--color-primary);
    color: var(--color-white);
  }

  .m-app--rail-icon__active:hover {
    background: var(--color-primary);
  }

  .m-app--rail-icon__disabled {
    cursor: default;
    opacity: 0.5;
  }

  .m-app--rail-icon__disabled:hover {
    background: none;
    color: var(--color-white-50);
  }

  .m-app--rail-add {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    margin-top: auto;
    border-radius: 50%;
    border: 1px dashed var(--color-white-30);
    color: var(--color-white-50);
    cursor: default;
  }

  .m-app--rail-add .c-zaap-icon {
    width: 14px;
    height: 14px;
  }

  /**
   * Content (header + tab-games), a droite du rail
   */
  .m-app--content {
    position: relative;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    height: 100%;
  }

  .m-app--header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--header-height);
    background: var(--color-black-60);
    padding: 0 16px;
    z-index: 1;
  }

  .m-app--header-banner {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .m-app--header-banner-logo-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .m-app--header-banner-logo {
    height: 28px;
  }

  .m-app--header-banner-deco {
    width: 18px;
    height: 18px;
    color: var(--color-lighten-primary);
    opacity: 0.8;
  }

  .m-app--header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .m-app--header-action {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    color: var(--color-white-50);
    cursor: pointer;
    transition: background 150ms, color 150ms;
  }

  .m-app--header-action .c-zaap-icon {
    width: 18px;
    height: 18px;
  }

  .m-app--header-action:hover {
    background: var(--color-white-10);
    color: var(--color-white);
  }
</style>
